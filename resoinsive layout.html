<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    line-height: 1.6;
}

header {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 2rem 1rem;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 20px auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
}

footer {
    text-align: center;
    padding: 20px;
    background: #2c3e50;
    color: white;
}

/* Mobile adjustments */
@media (max-width: 768px) {
    header h1 {
        font-size: 2rem;
    }

    .container {
        width: 95%;
    }

    .card {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Bianca Gruber</h1>
    <p>Student | Developer | Creator</p>
</header>

<div class="container">

    <div class="card">
        <h2>About Me</h2>
        <p>
            Welcome to my website! This page automatically adjusts
            to phones, tablets, and desktop screens.
        </p>
    </div>

    <div class="card">
        <h2>Projects</h2>
        <p>List your projects here.</p>
    </div>

    <div class="card">
        <h2>Contact</h2>
        <p>Email: your@email.com</p>
    </div>

</div>

<footer>
    <p>&copy; 2026 Bianca Gruber</p>
</footer>

</body>
</html>
